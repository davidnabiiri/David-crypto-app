<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Register - Crypto App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 { margin-bottom: 5px; }

    p {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2563eb;
    }

    .terms {
      font-size: 12px;
      margin-top: 10px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .error {
      color: #ff4d4d;
      font-size: 12px;
      margin-top: 8px;
    }

    .success {
      color: lightgreen;
      font-size: 12px;
      margin-top: 8px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Free Account</h2>
    <p>Start trading crypto</p>
    <p>Create your account in seconds</p>

    <form id="registerForm">

      <input type="text" id="name" placeholder="Full Name" required>

      <input type="email" id="email" placeholder="Email Address" required>

      <input type="password" id="password" placeholder="Password (min 6 chars)" required>

      <input type="password" id="confirm" placeholder="Confirm Password" required>

      <div class="terms">
        <input type="checkbox" id="agree" required>
        I agree to Terms & Privacy Policy
      </div>

      <button id="btn" type="submit">Create Account</button>

      <div id="msg"></div>

      <p style="text-align:center; margin-top:10px;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </form>

  </div>

  <script>
    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      msg.innerHTML = "";

      // 🔴 VALIDATION
      if (password.value.length < 6) {
        msg.innerHTML = "<div class='error'>Password too short</div>";
        return;
      }

      if (password.value !== confirm.value) {
        msg.innerHTML = "<div class='error'>Passwords do not match</div>";
        return;
      }

      btn.innerText = "Creating...";
      btn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: name.value,
            email: email.value,
            password: password.value
          })
        });

        const data = await res.json();

        if (res.ok) {
          msg.innerHTML = "<div class='success'>Account created successfully!</div>";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);

        } else {
          msg.innerHTML = "<div class='error'>" + data.message + "</div>";
        }

      } catch (err) {
        msg.innerHTML = "<div class='error'>Server error</div>";
      }

      btn.innerText = "Create Account";
      btn.disabled = false;
    });
  </script>

</body>
</html>
<footer style="text-align:center; padding:15px; font-size:12px; color:gray;">
  Demo Project – For educational purposes only. Do not enter real personal information.
</footer>
